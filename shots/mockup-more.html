<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>更多按钮展开原型</title>
<style>
:root{
	--bg:#151518; --panel:#1d1d21; --border:#3a3a44; --text:#e9e9f0; --sub:#9a9aa8;
	--hover:rgba(255,255,255,.07); --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.6 system-ui,"Segoe UI",sans-serif;padding:34px 38px}
h2{margin:0 0 4px;font-size:15px}
p.hint{margin:0 0 22px;color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;gap:18px;margin:18px 0;padding:14px 18px;background:var(--panel);border:1px solid var(--border);border-radius:10px;width:540px}
.label{width:86px;flex:none;color:var(--sub);font-size:12px}
/* ---- 与 lib/client.js 中一致的样式 ---- */
.dshg-moreBar{position:relative;flex:none;width:26px;height:20px;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;overflow:hidden;transition:width .24s var(--ease),border-color .15s ease}
.dshg-moreBar:hover{border-color:var(--text)}
.dshg-moreBarOpen{width:calc(22px * var(--count,3) + 30px)}
.dshg-moreSquares{position:absolute;left:50%;top:50%;transform:translate(calc(-50% - 0.3px),calc(-50% - 0.3px));display:grid;grid-template-columns:4px 4px;grid-template-rows:4px 4px;gap:3px;pointer-events:none}
.dshg-moreSquare{position:static;width:4px;height:4px;border:1px solid var(--sub);border-radius:1px;background:transparent;transition:transform .18s ease,opacity .16s ease;transition-delay:calc(110ms + var(--i) * 30ms)}
.dshg-moreBarOpen .dshg-moreSquare{transform:translateX(-10px);opacity:0;transition-delay:calc(var(--i) * 30ms)}
.dshg-moreItems{position:absolute;right:22px;top:50%;transform:translateY(-50%);display:flex;gap:3px}
.dshg-moreAction{width:22px;height:16px;display:grid;place-items:center;padding:0;border:0;border-radius:4px;background:transparent;color:var(--sub);cursor:pointer;opacity:0;transform:translateX(10px);pointer-events:none;transition:opacity .16s ease,transform .18s ease,color .12s ease;transition-delay:calc(var(--i) * 30ms)}
.dshg-moreAction:hover{color:var(--text);background:var(--hover)}
.dshg-moreBarOpen .dshg-moreAction{opacity:1;transform:none;pointer-events:auto;transition-delay:calc(120ms + var(--i) * 35ms)}
.dshg-moreArrow{position:absolute;right:6px;top:50%;width:11px;height:11px;display:grid;place-items:center;color:var(--sub);transform:translate(6px,-50%);opacity:0;pointer-events:none;transition:opacity .16s ease,transform .18s ease}
.dshg-moreBarOpen .dshg-moreArrow{opacity:1;transform:translate(0,-50%);pointer-events:auto;transition-delay:calc(150ms + var(--count,3) * 35ms)}
button.play{margin-top:8px;padding:6px 14px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text);cursor:pointer;font:inherit;font-size:12px}
button.play:hover{border-color:var(--text)}
</style>
</head>
<body>
<h2>更多按钮 · 展开动画</h2>
<p class="hint">点「更多」展开：四个空心方块依次左滑消失，分支 / 暂存 / 回收站三个图标从右侧滑入，最后出现收起箭头；展开时左侧四个动作按钮与分支按钮自动收起。</p>

<div class="row"><div class="label">收起</div><div class="dshg-moreBar" data-demo style="--count:3">
	<div class="dshg-moreSquares">
		<span class="dshg-moreSquare" style="--i:0"></span>
		<span class="dshg-moreSquare" style="--i:1"></span>
		<span class="dshg-moreSquare" style="--i:2"></span>
		<span class="dshg-moreSquare" style="--i:3"></span>
	</div>
	<div class="dshg-moreItems">
		<button class="dshg-moreAction" style="--i:0" title="分支管理">
			<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="4" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="12" cy="5" r="1.6"/><path d="M4 5.6v4.8"/><path d="M12 6.6c0 2.2-1.6 3-3.2 3H4"/></svg>
		</button>
		<button class="dshg-moreAction" style="--i:1" title="暂存改动">
			<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v6"/><path d="M5.5 6L8 8.5 10.5 6"/><path d="M3 10.5v2h10v-2"/></svg>
		</button>
		<button class="dshg-moreAction" style="--i:2" title="回收站">
			<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10"/><path d="M6 4.5V3.2h4v1.3"/><path d="M4.4 4.5l.6 8.2h6l.6-8.2"/><path d="M6.8 7v3.6M9.2 7v3.6"/></svg>
		</button>
	</div>
	<span class="dshg-moreArrow" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8L6 12.5"/></svg></span>
</div></div>

<div class="row"><div class="label">展开</div><div class="dshg-moreBar dshg-moreBarOpen" style="--count:3">
	<div class="dshg-moreSquares">
		<span class="dshg-moreSquare" style="--i:0"></span>
		<span class="dshg-moreSquare" style="--i:1"></span>
		<span class="dshg-moreSquare" style="--i:2"></span>
		<span class="dshg-moreSquare" style="--i:3"></span>
	</div>
	<div class="dshg-moreItems">
		<button class="dshg-moreAction" style="--i:0" title="分支管理">
			<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="4" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="12" cy="5" r="1.6"/><path d="M4 5.6v4.8"/><path d="M12 6.6c0 2.2-1.6 3-3.2 3H4"/></svg>
		</button>
		<button class="dshg-moreAction" style="--i:1" title="暂存改动">
			<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v6"/><path d="M5.5 6L8 8.5 10.5 6"/><path d="M3 10.5v2h10v-2"/></svg>
		</button>
		<button class="dshg-moreAction" style="--i:2" title="回收站">
			<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10"/><path d="M6 4.5V3.2h4v1.3"/><path d="M4.4 4.5l.6 8.2h6l.6-8.2"/><path d="M6.8 7v3.6M9.2 7v3.6"/></svg>
		</button>
	</div>
	<span class="dshg-moreArrow" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8L6 12.5"/></svg></span>
</div></div>

<button class="play" onclick="document.querySelectorAll('[data-demo]').forEach(function(bar){bar.classList.toggle('dshg-moreBarOpen')})">切换展开 / 收起</button>
</body>
</html>
